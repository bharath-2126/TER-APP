name: tracker_every_rupee
description: TER – Track Every Rupee. Offline-first personal finance mobile application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Local Reactive Database
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0

  # State Management & Reactive Binding
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Declarative Routing
  go_router: ^13.2.0

  # Security & Biometrics
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  encrypt: ^5.0.3

  # Formatting & Date manipulation
  intl: ^0.19.0
  uuid: ^4.3.3

  # UI & Animations
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0

  # Export Documents
  pdf: ^3.10.8
  csv: ^6.0.0
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
